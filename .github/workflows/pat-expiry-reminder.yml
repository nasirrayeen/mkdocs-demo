name: PAT Expiry Reminder

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-expiry:
    runs-on: ubuntu-latest
    steps:
      - name: Check expiry and notify Slack
        env:
          PAT_EXPIRY_DATE: ${{ vars.PAT_EXPIRY_DATE }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from datetime import date
          from urllib.request import Request, urlopen

          expiry_value = os.environ.get("PAT_EXPIRY_DATE", "").strip()
          webhook_url = os.environ.get("SLACK_WEBHOOK_URL", "").strip()

          if not expiry_value:
              sys.exit("Configure the PAT_EXPIRY_DATE repository variable (YYYY-MM-DD).")
          if not webhook_url:
              sys.exit("Configure the SLACK_WEBHOOK_URL repository secret.")

          try:
              expiry_date = date.fromisoformat(expiry_value)
          except ValueError:
              sys.exit("PAT_EXPIRY_DATE must use YYYY-MM-DD format.")

          days_left = (expiry_date - date.today()).days
          if days_left > 7:
              print(f"PAT expires in {days_left} days; no reminder is due yet.")
              sys.exit(0)

          if days_left < 0:
              message = f"GitHub PAT expired {-days_left} day(s) ago. Rotate it and update PAT_EXPIRY_DATE."
          elif days_left == 0:
              message = "GitHub PAT expires today. Rotate it and update PAT_EXPIRY_DATE."
          else:
              message = f"GitHub PAT expires in {days_left} day(s). Rotate it and update PAT_EXPIRY_DATE."

          payload = json.dumps({"text": f":warning: {message}"}).encode("utf-8")
          request = Request(
              webhook_url,
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urlopen(request, timeout=15) as response:
              if response.status < 200 or response.status >= 300:
                  sys.exit(f"Slack webhook returned HTTP {response.status}.")
          print("Sent PAT expiry reminder to Slack.")
          PY
