site_name: DevOps Fieldnotes
site_description: Practical guidance for building, securing, and operating modern software.
site_url: https://nasirrayeen.github.io/mkdocs-demo/
repo_url: https://github.com/nasirrayeen/mkdocs-demo
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Blog: blog/index.md
  - About: about.md

plugins:
  - search
  - blog:
      blog_dir: blog
      post_date_format: long
      post_url_format: "{slug}"
      post_excerpt: required
      archive: true
      archive_date_format: yyyy
      categories: true

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - tables
